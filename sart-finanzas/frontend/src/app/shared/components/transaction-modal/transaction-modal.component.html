<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ type === 'INCOME' ? 'Nuevo Ingreso' : 'Nuevo Egreso' }}</h2>
      <button class="btn-close" (click)="close.emit()">&times;</button>
    </div>

    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Monto</label>
        <div class="amount-input-wrapper" [class.is-income]="type === 'INCOME'" [class.is-expense]="type === 'EXPENSE'">
          <span class="currency-symbol">$</span>
          <input type="number" formControlName="amount" placeholder="0" class="amount-input">
        </div>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" formControlName="description" placeholder="Ej. Sueldo, Supermercado" class="text-input">
      </div>

      <div class="form-group">
        <label>Fecha</label>
        <input type="date" formControlName="date" class="text-input">
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <div class="category-tags">
          <button 
            type="button" 
            *ngFor="let cat of categories" 
            class="tag-btn" 
            [class.active]="transactionForm.get('category')?.value === cat"
            (click)="selectCategory(cat)">
            <span class="tag-icon">{{ getIcon(cat) }}</span> {{ cat }}
          </button>
          
          <div class="custom-category">
            <button 
              *ngIf="!showCustomInput" 
              type="button" 
              class="tag-btn tag-add" 
              [class.active]="isCustomCategoryActive"
              (click)="enableCustomCategory()">
              + Otra
            </button>
            <input 
              *ngIf="showCustomInput" 
              type="text" 
              class="tag-input" 
              placeholder="Escribe y presiona Enter"
              #customCatInput
              (keydown.enter)="addCustomCategory(customCatInput.value, $event)"
              (blur)="addCustomCategory(customCatInput.value, $event)"
              autofocus>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Cuenta</label>
        <select formControlName="accountId" class="text-input">
          <option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.name }}</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn" [class.btn-success]="type === 'INCOME'" [class.btn-danger]="type === 'EXPENSE'" [disabled]="transactionForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
